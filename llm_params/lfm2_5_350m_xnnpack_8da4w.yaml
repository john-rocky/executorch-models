# LFM2.5-350M -> XNNPACK, 8da4w + 8-bit embedding
# Based on executorch v1.4.0 examples/models/lfm2/config/lfm2_xnnpack_q8da4w.yaml
base:
  model_class: lfm2_5_350m
  params: ./llm_params/lfm2_5_350m_v1.4.0.json
  metadata: '{"get_bos_id": 1, "get_eos_ids":[7]}'

model:
  use_kv_cache: True
  use_sdpa_with_kv_cache: True
  dtype_override: fp32

quantization:
  qmode: 8da4w
  embedding_quantize: "8,0"

export:
  max_seq_length: 2048
  max_context_length: 2048
  output_dir: .
  output_name: lfm2_5_350m_xnnpack_8da4w.pte

backend:
  xnnpack:
    enabled: True
    extended_ops: True
